    /* ==============================================================================
       2. NORMALIZATION ENGINE (TỰ ĐỘNG CHUẨN HÓA KHUÔN MẪU DỮ LIỆU)
       ============================================================================== */
    function normalizeTitle(str) {
      if (!str) return '';
      let s = str.trim().replace(/\s+/g, ' ');
      s = s.charAt(0).toUpperCase() + s.slice(1);
      s = s.replace(/\btan khai\b/gi, 'Tân Khai')
           .replace(/\bdong nai\b/gi, 'Đồng Nai')
           .replace(/\btdtt\b/gi, 'TDTT')
           .replace(/\bubnd\b/gi, 'UBND')
           .replace(/\bvdv\b/gi, 'VĐV')
           .replace(/\bhcv\b/gi, 'HCV')
           .replace(/\bhcb\b/gi, 'HCB')
           .replace(/\bhcd\b/gi, 'HCĐ')
           .replace(/\bclb\b/gi, 'CLB');
      return s;
    }

    function normalizeCode(code, count) {
      if (!code) return 'T-' + String(count + 1).padStart(2, '0');
      let c = code.trim().toUpperCase().replace(/\s+/g, '');
      if (!c.startsWith('T-') && !c.startsWith('T')) {
        c = 'T-' + c;
      } else if (c.startsWith('T') && !c.startsWith('T-')) {
        c = 'T-' + c.slice(1);
      }
      return c;
    }

    function normalizeDate(d) {
      if (!d) {
        const today = new Date();
        return String(today.getDate()).padStart(2, '0') + '/' + String(today.getMonth() + 1).padStart(2, '0') + '/' + today.getFullYear();
      }
      let s = d.trim().replace(/[-.]/g, '/');
      const parts = s.split('/');
      if (parts.length === 3) {
        let day = parts[0].padStart(2, '0');
        let month = parts[1].padStart(2, '0');
        let year = parts[2];
        if (year.length === 2) year = '20' + year;
        return `${day}/${month}/${year}`;
      }
      return d;
    }

    function parseDateVN(str) {
      if (!str) return new Date(0);
      if (typeof str === 'string') {
        const s = str.trim();
        if (s.includes('/')) {
          const parts = s.split('/');
          if (parts.length === 3) return new Date(+parts[2], +parts[1] - 1, +parts[0]);
        } else if (s.includes('-')) {
          const parts = s.split('-');
          if (parts.length === 3) return new Date(+parts[0], +parts[1] - 1, +parts[2]);
        }
      }
      const d = new Date(str);
      return isNaN(d.getTime()) ? new Date(0) : d;
    }

    function formatDateVN(d) {
      if (!d || !(d instanceof Date) || isNaN(d.getTime())) return '';
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      return `${dd}/${mm}/${d.getFullYear()}`;
    }

    function sortActivitiesByLatest(arr) {
      if (!Array.isArray(arr)) return [];
      return [...arr].sort((a, b) => {
        const tA = parseDateVN(a.date).getTime();
        const tB = parseDateVN(b.date).getTime();
        if (tB !== tA) return tB - tA; // Giải mới nhất luôn ở vị trí số 1 (#1)
        return (b.code || '').localeCompare(a.code || '');
      });
    }

    function extractYearFromDate(dateStr) {
      if (!dateStr) return new Date().getFullYear();
      const match = dateStr.match(/\b(20\d\d)\b/);
      return match ? parseInt(match[1]) : new Date().getFullYear();
    }

    function extractQuarterFromDate(dateStr) {
      if (!dateStr) return 'q1';
      const parts = dateStr.split('/');
      if (parts.length >= 2) {
        const m = parseInt(parts[1]);
        if (m >= 1 && m <= 3) return 'q1';
        if (m >= 4 && m <= 6) return 'q2';
        if (m >= 7 && m <= 9) return 'q3';
        return 'q4';
      }
      return 'q1';
    }

    function autoDetectSport(title) {
      if (!title) return 'Bóng đá';
      const t = title.toLowerCase();
      if (t.includes('bóng đá')) return 'Bóng đá';
      if (t.includes('cầu lông')) return 'Cầu lông';
      if (t.includes('pickleball')) return 'Pickleball';

      if (t.includes('kéo co')) return 'Kéo co';
      if (t.includes('đẩy gậy')) return 'Đẩy gậy';
      if (t.includes('bi sắt')) return 'Bi sắt';
      if (t.includes('bơi')) return 'Bơi lội';
      if (t.includes('billiards')) return 'Billiards';
      return 'Thể thao phong trào';
    }

              r.author = 'Trần Quốc Được';
              changed = true;
            }
          });
        }
        // 2. Phục hồi các hoạt động bị lỗi font / ký tự hỏi chấm từ INITIAL_ACTIVITIES
        if (Array.isArray(state.activities)) {
          state.activities.forEach(a => {
            const init = INITIAL_ACTIVITIES.find(ia => ia.id === a.id || ia.code === a.code);
            if (init) {
              if (/\?\s*ch|gi\?i|\?i\?n|lA'ng|Tr\?n|/.test(a.title || '') || /\?\s*ch|gi\?i|\?i\?n|lA'ng|Tr\?n|/.test(a.achievementNote || '')) {
                a.title = init.title;
                a.sport = init.sport;
                a.location = init.location;
                a.achievementNote = init.achievementNote;
                changed = true;
              }
            }
          });
        }
        // 3. Phục hồi các CLB nếu có chuỗi lỗi
        if (Array.isArray(state.clubs)) {
          state.clubs.forEach(c => {
            const initC = INITIAL_CLUBS.find(ic => ic.id === c.id || ic.code === c.code);
            if (initC && (/\?|/.test(c.name || '') || /\?|/.test(c.sport || ''))) {
              c.name = initC.name;
              c.sport = initC.sport;
              c.location = initC.location;
              changed = true;
            }
          });
        }
        // 4. Đồng bộ 2 lịch Telegram mẫu theo chu kỳ chuẩn:
        // Nhà nước: ngày 11 lúc 08:00 (chốt 10 tháng trước đến 10 tháng này), Chi bộ: ngày 28 lúc 08:30 (trọn tháng)
        if (Array.isArray(state.telegramSchedules)) {
          const nn = state.telegramSchedules.find(s => s.id === 'sched-nhanuoc');
          if (nn && (nn.dayOfMonth === 25 || !nn.name.includes('Chốt ngày 10'))) {
            nn.dayOfMonth = 11;
            nn.timeOfDay = '08:00';
            nn.name = 'Báo cáo công tác TDTT định kỳ (Mẫu Nhà nước - Chốt ngày 10)';
            changed = true;
          }
          const cb = state.telegramSchedules.find(s => s.id === 'sched-chibo');
          if (cb && (cb.period === 'quarter' || !cb.name.includes('Trọn tháng'))) {
            cb.period = 'month';
            cb.dayOfMonth = 28;
            cb.timeOfDay = '08:30';
            cb.name = 'Báo cáo nhiệm vụ Đảng viên (Mẫu Chi bộ - Trọn tháng)';
            changed = true;
          }
        }
        if (changed) {
          saveAll();
        }
      } catch (err) {
        console.warn('Auto-healer note:', err);
      }
    }
    healDataEncoding();

    function getAvailableYears() {
      const yearsSet = new Set();
      state.activities.forEach(a => {
        const y = a.year || extractYearFromDate(a.date);
        if (y) yearsSet.add(y);
      });
      state.budgetItems.forEach(b => {
        if (b.year) yearsSet.add(parseInt(b.year));
      });
      yearsSet.add(new Date().getFullYear());
      yearsSet.add(2026);
      yearsSet.add(2025);
      return Array.from(yearsSet).sort((a, b) => b - a);
    }

    function showToast(title, msg, type = 'success') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const el = document.createElement('div');
      const isErr = type === 'error';
      const icon = isErr ? 'error' : (type === 'warning' ? 'warning' : 'check_circle');
      const borderCol = isErr ? 'border-rose-500' : 'border-brand-500';

      el.className = `pointer-events-auto flex items-start gap-3 p-4 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md rounded-2xl border-l-4 ${borderCol} shadow-mobbin-hover text-slate-800 dark:text-slate-100 max-w-sm transition-all duration-300 transform translate-y-2 opacity-0`;
      el.innerHTML = `
        <span class="material-symbols-outlined text-[20px] ${isErr ? 'text-rose-500' : 'text-brand-600'} shrink-0 mt-0.5">${icon}</span>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-bold leading-tight">${title}</p>
          <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 leading-snug">${msg}</p>
        </div>
      `;
      container.appendChild(el);
      requestAnimationFrame(() => {
        el.classList.remove('translate-y-2', 'opacity-0');
      });
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 3500);
    }

    function handleDashboardSearch(query) {
      if (!query.trim()) return;
      state.tournamentsFilter.search = query.trim();
      switchTab('quan-ly-giai-dau');
    }

    let donutChartInstance = null;
    let barChartInstance = null;

    function initDashboardCharts() {
      const filteredActs = state.selectedYear === 'all'
        ? state.activities
        : state.activities.filter(a => String(a.year || extractYearFromDate(a.date)) === String(state.selectedYear));

      // 1. Group by Sport
      const sportCounts = {};
      filteredActs.forEach(a => {
        const s = a.sport || 'Khác';
        sportCounts[s] = (sportCounts[s] || 0) + 1;
      });

      const donutEl = document.getElementById('sportsDonutChart');
      if (donutEl) {
        if (donutChartInstance) donutChartInstance.destroy();
        donutChartInstance = new Chart(donutEl, {
          type: 'doughnut',
          data: {
            labels: Object.keys(sportCounts),
            datasets: [{
              data: Object.values(sportCounts),
              backgroundColor: ['#059669', '#3b82f6', '#f59e0b', '#ec4899', '#8b5cf6', '#14b8a6', '#f97316'],
              borderWidth: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
            },
            cutout: '68%'
          }
        });
      }

      // 2. Group by Month
      const monthData = Array(12).fill(0);
      filteredActs.forEach(a => {
        const m = parseInt(a.month) || (a.date ? parseInt(a.date.split('/')[1]) : 1);
        if (m >= 1 && m <= 12) {
          monthData[m - 1] += parseInt(a.participants) || 0;
        }
      });

      const barEl = document.getElementById('timelineBarChart');
      if (barEl) {
        if (barChartInstance) barChartInstance.destroy();
        barChartInstance = new Chart(barEl, {
          type: 'bar',
          data: {
            labels: ['Th 1', 'Th 2', 'Th 3', 'Th 4', 'Th 5', 'Th 6', 'Th 7', 'Th 8', 'Th 9', 'Th 10', 'Th 11', 'Th 12'],
            datasets: [{
              label: 'Số lượng VĐV tham gia',
              data: monthData,
              backgroundColor: 'rgba(5, 150, 105, 0.75)',
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.04)' } },
              x: { grid: { display: false } }
            },
            plugins: {
              legend: { display: false }
            }
          }
        });
      }
    }

    function renderTournaments() {

        if (state.selectedYear !== 'all' && y !== String(state.selectedYear)) return false;
        if (f.category !== 'all' && a.category !== f.category) return false;
        if (f.sport !== 'all' && a.sport !== f.sport) return false;
        if (f.search) {
          const q = f.search.toLowerCase();
          const matchTitle = (a.title || '').toLowerCase().includes(q);
          const matchCode = (a.code || '').toLowerCase().includes(q);
          const matchSport = (a.sport || '').toLowerCase().includes(q);
          const matchLoc = (a.location || '').toLowerCase().includes(q);
          if (!matchTitle && !matchCode && !matchSport && !matchLoc) return false;
        }
        return true;
      });

      // Tự động sắp xếp: Giải mới nhất luôn ở vị trí số 1 (#1)
      acts = sortActivitiesByLatest(acts);

      modal.innerHTML = `

              <div>
                <label class="block font-bold mb-1">Chủ nhiệm CLB <span class="text-rose-500">*</span></label>

              <div>
                <label class="block font-bold mb-1">Số điện thoại</label>

      document.getElementById('club_name')?.addEventListener('blur', function() {
        this.value = normalizeTitle(this.value);
      });
      document.getElementById('club_leader')?.addEventListener('blur', function() {
        this.value = normalizeTitle(this.value);
      });
    }

    function handleSaveClub(e) {
      e.preventDefault();
      const id = document.getElementById('club_id').value;
      const item = {
        id: id || 'club-' + Date.now(),
        code: document.getElementById('club_code').value.trim() || 'CLB-0' + (state.clubs.length + 1),
        name: normalizeTitle(document.getElementById('club_name').value),
        sport: normalizeTitle(document.getElementById('club_sport').value),
        leader: normalizeTitle(document.getElementById('club_leader').value),
        phone: document.getElementById('club_phone').value.trim(),
        membersCount: parseInt(document.getElementById('club_members').value) || 0,
        establishedYear: parseInt(document.getElementById('club_year').value) || 2024,
        location: normalizeTitle(document.getElementById('club_loc').value),
        status: document.getElementById('club_status').value
      };

      if (id) {
        const idx = state.clubs.findIndex(c => c.id === id);
        if (idx !== -1) state.clubs[idx] = item;
      } else {
        state.clubs.unshift(item);
      }
      saveAll();
      closeModal();
      showToast('Đã lưu CLB', `Câu lạc bộ "${item.name}" đã được cập nhật.`);
      renderApp();
    }

    function confirmDeleteClub(id) {
      const c = state.clubs.find(item => item.id === id);
      if (confirm(`Bạn có chắc chắn muốn xóa "${c ? c.name : 'CLB này'}"?`)) {
        state.clubs = state.clubs.filter(item => item.id !== id);
        saveAll();
        showToast('Đã xóa CLB', 'Câu lạc bộ đã được xóa khỏi hệ thống.');
        renderApp();
      }
    }

    function handleSaveSchedule(e) {
      e.preventDefault();
      const id = document.getElementById('sched_id').value;
      const item = {
        id: id || 'sched-' + Date.now(),
        clubName: normalizeTitle(document.getElementById('sched_club').value),
        sport: normalizeTitle(document.getElementById('sched_sport').value),
        days: document.getElementById('sched_days').value.trim(),
        location: normalizeTitle(document.getElementById('sched_loc').value),
        description: document.getElementById('sched_desc').value.trim()
      };

      if (id) {
        const idx = state.schedules.findIndex(s => s.id === id);
        if (idx !== -1) state.schedules[idx] = item;
      } else {
        state.schedules.unshift(item);
      }
      saveAll();
      closeModal();
      showToast('Đã lưu lịch tập', `Lịch sinh hoạt "${item.clubName}" đã được cập nhật.`);
      renderApp();
    }

    function confirmDeleteSchedule(id) {
      if (confirm('Bạn có chắc chắn muốn xóa lịch sinh hoạt này?')) {

        saveAll();
        showToast('Đã xóa', 'Lịch sinh hoạt đã được xóa.');
        renderApp();
      }
    }

      if (id) {

    function handleSaveBudget(e) {
      e.preventDefault();
      const id = document.getElementById('bgt_id').value;

        id: id || 'bgt-' + Date.now(),
        code: document.getElementById('bgt_code').value.trim() || 'KP-0' + (state.budgetItems.length + 1),
        title: normalizeTitle(document.getElementById('bgt_title').value),
        year: parseInt(document.getElementById('bgt_year').value) || new Date().getFullYear(),
        source: document.getElementById('bgt_source').value,
        budgetEstimated: parseInt(document.getElementById('bgt_est').value) || 0,
        budgetActual: parseInt(document.getElementById('bgt_act').value) || 0,
        refDoc: document.getElementById('bgt_doc').value.trim(),
        status: document.getElementById('bgt_status').value,
        note: document.getElementById('bgt_note').value.trim()
      };

      if (id) {
        const idx = state.budgetItems.findIndex(b => b.id === id);
        if (idx !== -1) state.budgetItems[idx] = item;
      } else {
        state.budgetItems.unshift(item);
      }
      saveAll();
      closeModal();
      showToast('Đã lưu kinh phí', `Hạng mục "${item.title}" đã được cập nhật.`);

    function confirmDeleteBudgetItem(id) {
      if (confirm('Bạn có chắc chắn muốn xóa mục kinh phí này?')) {
        state.budgetItems = state.budgetItems.filter(b => b.id !== id);
        saveAll();
        showToast('Đã xóa', 'Hạng mục kinh phí đã được xóa.');
        renderApp();

    /* ==============================================================================
       14. TAB 7: BÁO CÁO & SỔ LƯU TRỮ (REPORTS & REGISTRY) - ĐẦY ĐỦ THÁNG, QUÝ, 6T, 9T, NĂM
       ============================================================================== */
    function getReportMonths(opts = {}) {
      const p = opts.period || state.reportPeriod || 'month';
      if (p === 'month') {
        const m = parseInt(opts.month || state.reportMonth) || (new Date().getMonth() + 1);
        return { start: m, end: m };
      }
      if (p === 'quarter') {
        const q = parseInt(opts.quarter || state.reportQuarter) || 1;
        const s = (q - 1) * 3 + 1;
        return { start: s, end: s + 2 };
      }
      if (p === 'half') {
        const h = parseInt(opts.half || state.reportHalf) || 1;
        return h === 2 ? { start: 7, end: 12 } : { start: 1, end: 6 };
      }
      if (p === 'nine') return { start: 1, end: 9 };
      return { start: 1, end: 12 };
    }

    function getReportRange(opts = {}) {
      const mode = opts.mode || state.reportMode || 'state';
      const period = opts.period || state.reportPeriod || 'month';
      const year = parseInt(opts.year || state.reportYear) || new Date().getFullYear();

      if (mode === 'state') {
        // BÁO CÁO NHÀ NƯỚC (Gửi Văn phòng Trung tâm DVTH): Lấy từ ngày 10 tháng trước đến ngày 10 tháng này
        if (period === 'month') {
          const curM = parseInt(opts.month || state.reportMonth) || (new Date().getMonth() + 1);
          let prevM = curM - 1;
          let prevY = year;
          if (prevM < 1) {
            prevM = 12;
            prevY = year - 1;
          }
          const startDate = new Date(prevY, prevM - 1, 10, 0, 0, 0);
          const endDate = new Date(year, curM - 1, 10, 23, 59, 59);
          return { startDate, endDate, isStateMonthly: true, prevM, curM, year };
        } else if (period === 'quarter') {
          const q = parseInt(opts.quarter || state.reportQuarter) || 1;
          const endMonth = q * 3;
          let startMonth = endMonth - 3;
          let startYear = year;
          if (startMonth < 1) {
            startMonth = 12;
            startYear = year - 1;
          }
          const startDate = new Date(startYear, startMonth - 1, 10, 0, 0, 0);
          const endDate = new Date(year, endMonth - 1, 10, 23, 59, 59);
          return { startDate, endDate };
        } else if (period === 'half') {
          const h = parseInt(opts.half || state.reportHalf) || 1;
          const startDate = h === 1 ? new Date(year - 1, 11, 10, 0, 0, 0) : new Date(year, 5, 10, 0, 0, 0);
          const endDate = h === 1 ? new Date(year, 5, 10, 23, 59, 59) : new Date(year, 11, 10, 23, 59, 59);
          return { startDate, endDate };
        } else if (period === 'nine') {
          return {
            startDate: new Date(year - 1, 11, 10, 0, 0, 0),
            endDate: new Date(year, 8, 10, 23, 59, 59)
          };
        } else {
          return {
            startDate: new Date(year - 1, 11, 10, 0, 0, 0),
            endDate: new Date(year, 11, 10, 23, 59, 59)
          };
        }
      } else {
        // BÁO CÁO CHI BỘ: Từ ngày 1 đầu tháng đến ngày cuối cùng của tháng
        const months = getReportMonths(opts);
        const startDate = new Date(year, months.start - 1, 1, 0, 0, 0);
        const endDate = new Date(year, months.end, 0, 23, 59, 59);
        return { startDate, endDate, isPartyMonthly: true };
      }
    }

    function getReportData(opts = {}) {
      const mode = opts.mode || state.reportMode || 'state';
      const range = opts.range || getReportRange(opts);

      // 1. Hoạt động nằm đúng trong kỳ báo cáo
      const list = (state.activities || []).filter(a => {
        if (!a.date) return false;
        const d = parseDateVN(a.date);
        return d && d >= range.startDate && d <= range.endDate;
      }).map(a => ({ ...a, isCarryOver: false }));

      // 2. Tự động rà soát hoạt động của kỳ trước chưa được báo cáo (Catch-up / Carry-over)
      // Tìm các hoạt động diễn ra trước range.startDate (trong vòng 45 ngày trước)
      const lookbackDate = new Date(range.startDate.getTime() - 45 * 24 * 60 * 60 * 1000);

      // Tập hợp ID các giải đấu đã được lưu trong các báo cáo chính thức trước đó
      const reportedActIds = new Set();
      (state.savedReports || []).forEach(r => {
        if (r.mode === mode && Array.isArray(r.reportedActIds)) {
          r.reportedActIds.forEach(id => reportedActIds.add(id));
        }
      });

      const carryOverActs = (state.activities || []).filter(a => {
        if (!a.date) return false;
        const d = parseDateVN(a.date);
        if (!d) return false;
        if (d >= lookbackDate && d < range.startDate) {
          if (!list.some(item => item.id === a.id)) {
            if (!reportedActIds.has(a.id) || a.forceCarryOver) {
              return true;
            }
          }
        }
        return false;
      }).map(a => ({
        ...a,
        isCarryOver: true,
        achievementNote: a.achievementNote ? `${a.achievementNote} (Bổ sung kỳ trước)` : 'Bổ sung từ kỳ trước chưa báo cáo'
      }));

      const combined = [...list, ...carryOverActs];
      return sortActivitiesByLatest(combined);
    }

    function getPeriodTitle(opts = {}) {
      const p = opts.period || state.reportPeriod || 'month';
      const y = opts.year || state.reportYear || new Date().getFullYear();
      if (p === 'month') {
        const m = opts.month || state.reportMonth || (new Date().getMonth() + 1);
        return `THÁNG ${m} NĂM ${y}`;
      }
      if (p === 'quarter') {
        const q = opts.quarter || state.reportQuarter || 1;
        const roman = ['I', 'II', 'III', 'IV'][q - 1];
        return `QUÝ ${roman} NĂM ${y}`;
      }
      if (p === 'half') {
        const h = opts.half || state.reportHalf || 1;
        return (h === 1 ? '6 THÁNG ĐẦU NĂM ' : '6 THÁNG CUỐI NĂM ') + y;
      }
      if (p === 'nine') return `9 THÁNG ĐẦU NĂM ${y}`;
      return `NĂM ${y}`;
    }

    function getPeriodSubtitle(opts = {}) {
      const p = opts.period || state.reportPeriod || 'month';
      const y = opts.year || state.reportYear || new Date().getFullYear();
      if (p === 'month') {
        const m = opts.month || state.reportMonth || (new Date().getMonth() + 1);
        return `tháng ${m} năm ${y}`;
      }
      if (p === 'quarter') {
        const q = opts.quarter || state.reportQuarter || 1;
        const roman = ['I', 'II', 'III', 'IV'][q - 1];
        return `quý ${roman} năm ${y}`;
      }
      if (p === 'half') {
        const h = opts.half || state.reportHalf || 1;
        return (h === 1 ? '6 tháng đầu năm ' : '6 tháng cuối năm ') + y;
      }
      if (p === 'nine') return `9 tháng đầu năm ${y}`;
      return `năm ${y}`;
    }

    function renderReports() {
      const sub = state.reportSubTab || 'document';
      const availableYears = getAvailableYears();

      // Số báo cáo tiếp theo tự động
      const maxRepNum = state.savedReports.reduce((m, r) => Math.max(m, parseInt(r.reportNumber) || 0), 0);

      const nextReportCode = state.reportMode === 'party' ? `${nextReportNum}/BC-CB` : `${nextReportNum}/BC-TDTT`;

      let activeRep = state.savedReports.find(r => r.id === state.activeReportId) || state.savedReports[0];

      const activeSchedCount = (state.telegramSchedules || []).filter(s => s.enabled).length;
      const totalSchedCount = (state.telegramSchedules || []).length;

      return `
        <div class="space-y-6 tab-pane-animate">
          <!-- Header & Sub-Tab Switcher -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 class="text-2xl font-display font-extrabold text-slate-900 dark:text-white tracking-tight">
                Báo Cáo & Sổ Lưu Trữ Báo Cáo
              </h1>
              <p class="text-xs text-slate-500 mt-1">Đơn vị lập: <b>Bộ phận Thể dục thể thao</b> • Trung tâm Dịch vụ tổng hợp Phường Tân Khai</p>
            </div>

            <!-- Sub Tabs & Telegram Config Button -->
            <div class="flex items-center gap-2 flex-wrap">
              <button onclick="openTelegramConfigModal('list')" class="px-3.5 py-2 rounded-2xl text-xs font-bold transition-all flex items-center gap-1.5 ${activeSchedCount > 0 ? 'bg-sky-50 dark:bg-sky-950/60 text-sky-700 dark:text-sky-300 border border-sky-300 dark:border-sky-800' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700'} btn-press" title="Quản lý các cấu hình tự động gửi báo cáo qua Telegram">
                <span class="material-symbols-outlined text-[16px] text-sky-500">schedule_send</span>
                <span>Lịch gửi Telegram (${activeSchedCount}/${totalSchedCount})</span>
                ${activeSchedCount > 0 ? `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>` : ''}
              </button>

              <div class="flex items-center gap-1 p-1 bg-slate-100 dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800">
                <button onclick="setReportSubTab('document')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${sub === 'document' ? 'bg-white dark:bg-slate-800 text-brand-700 dark:text-brand-400 shadow-sm' : 'text-slate-500'}">
                  <span class="material-symbols-outlined text-[16px]">description</span>
                  <span>Văn bản báo cáo</span>
                </button>
                <button onclick="setReportSubTab('registry')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${sub === 'registry' ? 'bg-white dark:bg-slate-800 text-brand-700 dark:text-brand-400 shadow-sm' : 'text-slate-500'}">
                  <span class="material-symbols-outlined text-[16px]">format_list_numbered</span>
                  <span>Sổ lưu trữ (${state.savedReports.length})</span>
                </button>
              </div>
            </div>
          </div>

          ${sub === 'document' ? renderReportDocumentView(activeRep, nextReportCode, availableYears) : renderReportRegistryView()}
        </div>
      `;
    }

    function setReportSubTab(tab) {
      state.reportSubTab = tab;
      renderApp();
    }

    function setReportFilter(key, val) {
      state[key] = val;
      saveAll();
      renderApp();
    }

        function renderReportDocumentView(rep, nextCode, availableYears) {
      const isParty = state.reportMode === 'party';
      const range = getReportRange();
      const list = getReportData();
      const periodTitle = getPeriodTitle();
      const periodSubtitle = getPeriodSubtitle();

      const totalActs = list.length;
      const totalParticipants = list.reduce((a, b) => a + (parseInt(b.participants) || 0), 0);
      const totalMedals = list.reduce((a, b) => a + (parseInt(b.totalMedals) || 0), 0);
      const totalGold = list.reduce((a, b) => a + (parseInt(b.goldMedals) || 0), 0);
      const totalSilver = list.reduce((a, b) => a + (parseInt(b.silverMedals) || 0), 0);
      const totalBronze = list.reduce((a, b) => a + (parseInt(b.bronzeMedals) || 0), 0);
      const totalBudget = list.reduce((a, b) => a + (parseInt(b.budgetTotal) || 0), 0);

      // Phân loại hoạt động theo cấp độ
      const sec1 = list.filter(a => a.category === 'Cấp phường');
      const sec2 = list.filter(a => a.category === 'Cấp thành phố');
      const sec3 = list.filter(a => a.category !== 'Cấp phường' && a.category !== 'Cấp thành phố');

      // Đơn vị nhận báo cáo (chuẩn nghiệp vụ: gửi Văn phòng Trung tâm hoặc Phòng Văn hóa, không gửi thẳng UBND phường)
      let recipientText = 'Văn phòng Trung tâm Dịch vụ Tổng hợp phường Tân Khai';
      if (isParty) {
        recipientText = 'Chi bộ Trung tâm Dịch vụ Tổng hợp phường Tân Khai';
      } else if (state.reportRecipient === 'phong_vanhoa') {
        recipientText = 'Phòng Văn hóa và Thông tin';

    function exportDocxFile() {
      const html = buildReportHTMLForWord();
      const blob = new Blob(['\ufeff', html], { type: 'application/msword;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      const modeName = state.reportMode === 'party' ? 'ChiBo' : 'NhaNuoc';
      const cleanPeriod = getPeriodTitle().replace(/\s+/g, '_');
      link.download = `BaoCao_${modeName}_${cleanPeriod}.doc`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('Đã xuất file Word', `Báo cáo ${getPeriodTitle()} đã được tải về máy.`);
    }

        reportDate: new Date().toLocaleDateString('vi-VN'),

        reportedActIds: list.map(a => a.id),

    function handleSaveScheduleConfig(e) {
      e.preventDefault();
      const id = document.getElementById('cfg_id').value;
      const name = document.getElementById('cfg_name').value.trim();
      const mode = document.getElementById('cfg_mode').value;
      const period = document.getElementById('cfg_period').value;
      const recipient = document.getElementById('cfg_recipient').value;
      const schedType = document.getElementById('cfg_sched_type').value;
      const dayOfMonth = parseInt(document.getElementById('cfg_day_month').value) || 25;
      const timeOfDay = document.getElementById('cfg_time_day').value || '08:00';
      const sendKpiSummary = document.getElementById('cfg_send_kpi').checked;
      const sendFullDocument = document.getElementById('cfg_send_doc').checked;
      const enabled = document.getElementById('cfg_enabled').checked;

      const idx = (state.telegramSchedules || []).findIndex(s => s.id === id);
      const item = {
        id: id,
        name: name,
        enabled: enabled,
        mode: mode,
        period: period,
        recipient: recipient,
        scheduleType: schedType,
        dayOfMonth: dayOfMonth,
        timeOfDay: timeOfDay,
        sendKpiSummary: sendKpiSummary,
        sendFullDocument: sendFullDocument,
        lastSent: idx !== -1 ? state.telegramSchedules[idx].lastSent : ''
      };

      if (!state.telegramSchedules) state.telegramSchedules = [];
      if (idx !== -1) {
        state.telegramSchedules[idx] = item;
      } else {
        state.telegramSchedules.push(item);
      }

      saveAll();
      closeModal();
      openTelegramConfigModal('list');
      showToast('Đã lưu cấu hình', `Cấu hình "${name}" đã được lưu vào danh sách.`);
      renderApp();
    }

    function toggleTelegramSchedule(schedId) {
      const sched = (state.telegramSchedules || []).find(s => s.id === schedId);
      if (sched) {

        showToast(sched.enabled ? 'Đã bật cấu hình' : 'Đã tắt cấu hình', `Cấu hình "${sched.name}" đã ${sched.enabled ? 'được kích hoạt' : 'tạm dừng'}.`);
        closeModal();
        openTelegramConfigModal('list');
        renderApp();

    async function executeTelegramSchedule(schedId, isManual = false) {
      const sched = (state.telegramSchedules || []).find(s => s.id === schedId);
      if (!sched) {
        alert('Không tìm thấy cấu hình gửi báo cáo này!');
        return;
      }

      const settings = state.telegramSettings || {};
      const botToken = settings.botToken;
      const chatId = settings.chatId;

      if (!botToken || !chatId) {
        if (confirm('Anh chưa lưu Telegram Bot Token và Chat ID. Anh có muốn mở tab Cài đặt ngay bây giờ không?')) {
          closeModal();
          openTelegramConfigModal('settings');
        }
        return;
      }

      const isParty = sched.mode === 'party';
      let recipientText = 'Văn phòng Trung tâm Dịch vụ Tổng hợp';
      if (isParty || sched.recipient === 'Chi bộ Trung tâm DVTH') {
        recipientText = 'Chi bộ Trung tâm Dịch vụ Tổng hợp';
      } else if (sched.recipient === 'phong_vanhoa') {
        recipientText = 'Phòng Văn hóa và Thông tin';
      }

      // Lấy dữ liệu và phạm vi chuẩn xác theo quy định:
      // - Mẫu Nhà nước: từ ngày 10 tháng trước đến ngày 10 tháng này
      // - Mẫu Chi bộ: từ ngày 1 đến ngày cuối cùng của tháng
      const today = new Date();
      const year = state.reportYear || today.getFullYear();
      const curM = today.getMonth() + 1;
      const q = Math.floor(today.getMonth() / 3) + 1;

      const range = getReportRange({
        mode: sched.mode,
        period: sched.period,
        year: year,
        month: curM,
        quarter: q
      });

      const filteredActs = getReportData({
        mode: sched.mode,
        period: sched.period,
        year: year,
        month: curM,
        quarter: q,
        range: range
      });

      const periodLabel = getPeriodTitle({
        period: sched.period,
        year: year,
        month: curM,
        quarter: q
      });

      const totalActs = filteredActs.length;
      const totalParticipants = filteredActs.reduce((a, b) => a + (parseInt(b.participants) || 0), 0);
      const totalMedals = filteredActs.reduce((a, b) => a + (parseInt(b.totalMedals) || 0), 0);
      const totalGold = filteredActs.reduce((a, b) => a + (parseInt(b.goldMedals) || 0), 0);
      const totalSilver = filteredActs.reduce((a, b) => a + (parseInt(b.silverMedals) || 0), 0);
      const totalBronze = filteredActs.reduce((a, b) => a + (parseInt(b.bronzeMedals) || 0), 0);
      const totalBudget = filteredActs.reduce((a, b) => a + (parseInt(b.budgetTotal) || 0), 0);

      // 1. GỬI TIN NHẮN TÓM TẮT SỐ LIỆU KPI
      if (sched.sendKpiSummary !== false) {
        let msg = `📋 <b>${sched.name.toUpperCase()}</b>\n`;
        msg += `🏷️ <i>Thể thức: ${isParty ? 'Báo cáo Chi bộ Đảng' : 'Báo cáo Công tác TDTT (Nhà nước)'}</i>\n`;
        msg += `📍 <i>Trung tâm Dịch vụ tổng hợp Phường Tân Khai</i>\n`;
        msg += `👤 <b>Người lập:</b> Trần Quốc Được (${isParty ? 'Đảng viên' : 'Cán bộ phụ trách TDTT'})\n`;
        msg += `📤 <b>Gửi đến:</b> ${recipientText}\n`;
        msg += `📅 <b>Kỳ báo cáo:</b> ${periodLabel} (${formatDateVN(startDate)} ➔ ${formatDateVN(endDate)})\n\n`;
        msg += `📊 <b>SỐ LIỆU TỔNG HỢP & KPI:</b>\n`;
        msg += `• Tổng số giải đấu: <b>${totalActs}</b> giải\n`;
        msg += `• Lượt VĐV tham gia: <b>${totalParticipants.toLocaleString('vi-VN')}</b> lượt\n`;
        msg += `• Thành tích huy chương: <b>${totalMedals}</b> HC (${totalGold}🥇, ${totalSilver}🥈, ${totalBronze}🥉)\n`;
        msg += `• Tổng kinh phí giải ngân: <b>${totalBudget.toLocaleString('vi-VN')} đ</b>\n\n`;

        if (filteredActs.length > 0) {
          msg += `⭐ <b>DANH SÁCH GIẢI MỚI / TIÊU BIỂU:</b>\n`;
          filteredActs.slice(0, 3).forEach((a, i) => {
            msg += `${i + 1}. <b>${a.title}</b> (${a.date}) - ${a.participants} VĐV\n`;
            if (a.achievementNote) msg += `   ↳ <i>${a.achievementNote}</i>\n`;
          });
        }
        msg += `\n📌 <i>Kính báo cáo ${recipientText} xem xét, theo dõi và tổng hợp.</i>`;

        try {
          const resp = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: chatId,
              text: msg,
              parse_mode: 'HTML'
            })
          });
          const res = await resp.json();
          if (!res.ok) {
            if (res.description && res.description.toLowerCase().includes('chat not found')) {
              alert('⚠️ Lỗi: Telegram báo "Bad Request: chat not found"!\n\nAnh Được chỉ cần mở con Bot của mình trên Telegram và bấm nút START (hoặc gửi 1 tin nhắn cho Bot), sau đó quay lại gửi lại là được ngay ạ!');
              return;
            } else {
              throw new Error(res.description || 'Không thể gửi tin nhắn Telegram.');
            }
          }
        } catch (e) {
          alert('Lỗi gửi tin nhắn KPI: ' + e.message);
          return;
        }
      }

      // 2. GỬI FILE VĂN BẢN WORD (.DOC) HOÀN CHỈNH
      if (sched.sendFullDocument !== false) {
        try {
          const wordHtml = buildReportHTMLForWord({
            mode: sched.mode,
            period: sched.period,
            recipient: sched.recipient,
            year: year,
            month: curM,
            quarter: q,
            range: range,
            list: filteredActs,
            periodTitle: periodLabel
          });

          const blob = new Blob(['\ufeff', wordHtml], { type: 'application/msword;charset=utf-8' });
          const modeTag = isParty ? 'ChiBo' : 'TDTT';
          const periodTag = periodLabel.replace(/[\s\/\\]+/g, '_');
          const fileName = `BaoCao_${modeTag}_${periodTag}_TranQuocDuoc.doc`;

          const formData = new FormData();
          formData.append('chat_id', chatId);
          formData.append('document', blob, fileName);
          formData.append('caption', `📄 <b>File Báo Cáo Hoàn Chỉnh (Word .doc):</b>\n${sched.name}\n👤 <i>Người lập: Trần Quốc Được</i>\n📤 <i>Nơi nhận: ${recipientText}</i>`);
          formData.append('parse_mode', 'HTML');

          const docResp = await fetch(`https://api.telegram.org/bot${botToken}/sendDocument`, {
            method: 'POST',
            body: formData
          });
          const docRes = await docResp.json();
          if (!docRes.ok) {
            throw new Error(docRes.description || 'Không thể gửi file Word qua Telegram.');
          }
        } catch (docErr) {
          alert('Lỗi gửi file Word đính kèm: ' + docErr.message);
          return;
        }
      }

      // Cập nhật thời điểm gửi gần nhất
      sched.lastSent = new Date().toLocaleString('vi-VN');
      saveAll();

      if (isManual) {
        alert(`🎉 Thành công!\n\nHệ thống đã gửi số liệu KPI${sched.sendFullDocument !== false ? ' kèm File báo cáo Word (.doc)' : ''} vào Telegram của anh Trần Quốc Được theo cấu hình "${sched.name}".`);
      } else {
        showToast('Đã gửi báo cáo Telegram', `Đã gửi báo cáo "${sched.name}" thành công.`);
      }
      closeModal();
      openTelegramConfigModal('list');
      renderApp();
    }

      msg += `• Tổng kinh phí giải ngân: <b>${totalBudget.toLocaleString('vi-VN')} đ</b>\n\n`;

      if (list.length > 0) {
        msg += `⭐ <b>DANH SÁCH GIẢI TIÊU BIỂU:</b>\n`;
        list.slice(0, 5).forEach((a, i) => {
          msg += `${i + 1}. <b>${a.title}</b> (${a.date}) - ${a.participants} VĐV\n`;
          if (a.achievementNote) msg += `   ↳ <i>${a.achievementNote}</i>\n`;
        });
      }
      msg += `\n📌 <i>Kính báo cáo ${recipientText} xem xét, theo dõi và tổng hợp.</i>`;

      try {
        // 1. Gửi tin nhắn tóm tắt
        const resp = await fetch(`https://api.telegram.org/bot${settings.botToken}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: settings.chatId,
            text: msg,
            parse_mode: 'HTML'
          })
        });
        const res = await resp.json();
        if (!res.ok) {
          if (res.description && res.description.toLowerCase().includes('chat not found')) {
            alert('⚠️ Lỗi: Telegram báo "Bad Request: chat not found"!\n\nAnh chỉ cần mở con Bot của mình trên Telegram và bấm nút START (hoặc gửi 1 tin nhắn cho Bot), sau đó quay lại gửi lại là được ngay ạ!');
            return;
          } else {
            throw new Error(res.description || 'Lỗi gửi tin nhắn.');
          }
        }

        // 2. Đính kèm gửi luôn File Word .doc
        const wordHtml = buildReportHTMLForWord();
        const blob = new Blob(['\ufeff', wordHtml], { type: 'application/msword;charset=utf-8' });
        const modeTag = isParty ? 'ChiBo' : 'TDTT';
        const cleanPeriod = getPeriodTitle().replace(/[\s\/\\]+/g, '_');
        const fileName = `BaoCao_${modeTag}_${cleanPeriod}_TranQuocDuoc.doc`;

        const formData = new FormData();
        formData.append('chat_id', settings.chatId);
        formData.append('document', blob, fileName);
        formData.append('caption', `📄 <b>File Báo Cáo Hoàn Chỉnh (Word .doc):</b>\nBáo cáo ${getPeriodTitle()}\n👤 <i>Người lập: Trần Quốc Được</i>\n📤 <i>Nơi nhận: ${recipientText}</i>`);
        formData.append('parse_mode', 'HTML');

        await fetch(`https://api.telegram.org/bot${settings.botToken}/sendDocument`, {
          method: 'POST',
          body: formData
        });

        showToast('Đã gửi Telegram', `Báo cáo ${getPeriodTitle()} và file Word .doc đã được gửi vào Telegram của anh Được.`);
      } catch (err) {
        alert('Lỗi kết nối Telegram: ' + err.message);
      }
    }

    function handleSaveActivity(e) {
      e.preventDefault();
      const id = document.getElementById('act_id').value;
      const g = parseInt(document.getElementById('act_gold').value) || 0;
      const s = parseInt(document.getElementById('act_silver').value) || 0;
      const b = parseInt(document.getElementById('act_bronze').value) || 0;
      const bWard = parseInt(document.getElementById('act_budgetWard').value) || 0;
      const bPrize = parseInt(document.getElementById('act_budgetPrize').value) || 0;

      const rawTitle = document.getElementById('act_title').value;
      const cleanTitle = normalizeTitle(rawTitle);

      const rawCode = document.getElementById('act_code').value;
      const cleanCode = normalizeCode(rawCode, state.activities.length);

      const rawDate = document.getElementById('act_date').value;
      const cleanDate = normalizeDate(rawDate);
      const year = extractYearFromDate(cleanDate);
      const quarter = extractQuarterFromDate(cleanDate);

      const rawSport = document.getElementById('act_sport').value;
      const sport = rawSport.trim() ? normalizeTitle(rawSport) : autoDetectSport(cleanTitle);

      const rawNote = document.getElementById('act_note') ? document.getElementById('act_note').value.trim() : '';

      const item = {
        id: id || 'act-' + Date.now(),
        code: cleanCode,
        title: cleanTitle,
        sport: sport,
        category: document.getElementById('act_category').value,
        date: cleanDate,
        year: year,
        quarter: quarter,
        month: parseInt(cleanDate.split('/')[1]) || 1,
        participants: parseInt(document.getElementById('act_participants').value) || 0,
        participantsUnit: 'VĐV',
        location: normalizeTitle(document.getElementById('act_location').value),
        achievementNote: rawNote,
        status: 'Đã hoàn thành',
        goldMedals: g,
        silverMedals: s,
        bronzeMedals: b,
        totalMedals: g + s + b,
        budgetWard: bWard,
        budgetPrize: bPrize,
        budgetTotal: bWard + bPrize,
        budgetStatus: 'Đã quyết toán'
      };

      if (id) {
        const idx = state.activities.findIndex(a => a.id === id);
        if (idx !== -1) state.activities[idx] = item;
      } else {
        state.activities.unshift(item);
      }
      state.activities = sortActivitiesByLatest(state.activities);
      saveAll();
      closeModal();
      showToast('Đã lưu thành công', `Giải đấu "${item.title}" đã được chuẩn hóa và lưu trữ.`);
      renderApp();
    }

    }

              <input type="checkbox" ${state.autoSync ? 'checked' : ''} onchange="toggleAutoSync(this.checked)" class="w-4 h-4 accent-brand-700 cursor-pointer" />
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
              <button onclick="pushToGoogleSheet(true)" class="py-2.5 px-3 bg-brand-700 text-white font-bold rounded-xl flex items-center justify-center gap-1.5 shadow-sm cursor-pointer btn-press">
                <span class="material-symbols-outlined text-[16px]">cloud_upload</span>
                <span>Ghi lên Google Sheet</span>
              </button>
              <button onclick="pullFromGoogleSheet()" class="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold rounded-xl flex items-center justify-center gap-1.5 cursor-pointer btn-press">
                <span class="material-symbols-outlined text-[16px]">cloud_download</span>
                <span>Nạp lại từ Sheet</span>
              </button>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function saveApiUrl() {
      const v = document.getElementById('sync_api_url').value.trim();
      state.apiUrl = v;
      lsSet('tk_api_url', v);
      showToast('Đã lưu URL', 'Hệ thống sẽ đồng bộ với Apps Script Web App này.');
      renderSyncPill();
    }
    function toggleAutoSync(v) {
      state.autoSync = v;
      lsSet('tk_auto_sync', v);
    }

    async function pushToGoogleSheet(isManual = false) {
      if (!state.apiUrl) {
        if (isManual) openSyncModal();
        return;
      }

      state.syncStatus = 'syncing';
      renderSyncPill();

      const payload = {
        action: 'save_all',
        activities: state.activities,
        clubs: state.clubs,
        schedules: state.schedules,
        facilities: state.facilities,
        budget: state.budgetItems,
        reports: state.savedReports,
        timestamp: new Date().toISOString()
      };

      try {
        const resp = await fetch(state.apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const res = await resp.json();
        if (res.status === 'success' || res.success) {
          state.syncStatus = 'success';
          state.lastSyncTime = new Date().toLocaleTimeString('vi-VN');
          lsSet('tk_last_sync', state.lastSyncTime);
          if (isManual) showToast('Đồng bộ thành công', 'Toàn bộ dữ liệu đã được lưu an toàn lên Google Drive.');
        } else {
          state.syncStatus = 'error';
          if (isManual) showToast('Lỗi lưu Sheet', res.message || res.error || 'Không thể ghi vào Google Sheet', 'error');
        }
      } catch (err) {
        state.syncStatus = 'error';
        if (isManual) showToast('Lỗi kết nối', 'Không thể kết nối với Web App Google Drive.', 'error');
      } finally {
        renderSyncPill();
      }
    }

    async function pullFromGoogleSheet() {
      if (!state.apiUrl) {
        openSyncModal();
        return;
      }

      state.syncStatus = 'syncing';
      renderSyncPill();

      try {
        const url = state.apiUrl + (state.apiUrl.includes('?') ? '&' : '?') + 'action=load_all';
        const resp = await fetch(url);
        const res = await resp.json();
        if ((res.status === 'success' || res.success) && res.data) {
          if (res.data.activities) state.activities = res.data.activities;
          if (res.data.clubs) state.clubs = res.data.clubs;
          if (res.data.schedules) state.schedules = res.data.schedules;
          if (res.data.facilities) state.facilities = res.data.facilities;
          if (res.data.budget) state.budgetItems = res.data.budget;
          if (res.data.reports) state.savedReports = res.data.reports;

          state.syncStatus = 'success';
          state.lastSyncTime = new Date().toLocaleTimeString('vi-VN');
          lsSet('tk_last_sync', state.lastSyncTime);
          saveAll();
          showToast('Nạp dữ liệu thành công', 'Đã đồng bộ cơ sở dữ liệu mới nhất từ Google Sheet.');
          closeModal();
          renderApp();
        } else {
          state.syncStatus = 'error';
          showToast('Lỗi nạp', res.message || res.error || 'Không có dữ liệu trên Sheet', 'error');
        }
      } catch (err) {
        state.syncStatus = 'error';
        showToast('Lỗi kết nối', 'Không thể tải dữ liệu từ Google Drive.', 'error');
      } finally {
        renderSyncPill();
      }
    }

    function exportAllExcel() {
      try {
        const wb = XLSX.utils.book_new();

        // 1. Sheet Hoạt động
        const wsActs = XLSX.utils.json_to_sheet(state.activities.map(a => ({
          'Mã giải': a.code,
          'Tên giải đấu': a.title,
          'Ghi chú thành tích': a.achievementNote || '',
          'Bộ môn': a.sport,
          'Cấp độ': a.category,
          'Ngày tổ chức': a.date,
          'Năm': a.year,
          'Số VĐV': a.participants,
          'Địa điểm': a.location,
          'HCV': a.goldMedals,
          'HCB': a.silverMedals,
          'HCĐ': a.bronzeMedals,
          'Tổng HC': a.totalMedals,
          'Kinh phí Phường': a.budgetWard,
          'Kinh phí Thưởng': a.budgetPrize,
          'Tổng kinh phí': a.budgetTotal,
          'Tình trạng': a.status
        })));
        XLSX.utils.book_append_sheet(wb, wsActs, 'Giai_Thi_Dau');

        // 2. Sheet CLB
        const wsClubs = XLSX.utils.json_to_sheet(state.clubs.map(c => ({
          'Mã CLB': c.code,
          'Tên câu lạc bộ': c.name,
          'Môn thể thao': c.sport,
          'Chủ nhiệm': c.leader,
          'Số điện thoại': c.phone,
          'Số hội viên': c.membersCount,
          'Địa bàn': c.location,
          'Năm thành lập': c.establishedYear,
          'Trạng thái': c.status
        })));
        XLSX.utils.book_append_sheet(wb, wsClubs, 'Cau_Lac_Bo');

        // 3. Sheet Kinh phí
        const wsBudget = XLSX.utils.json_to_sheet(state.budgetItems.map(b => ({
          'Mã chi': b.code,
          'Hạng mục chi': b.title,
          'Năm': b.year,
          'Nguồn chi': b.source,
          'Dự toán duyệt': b.budgetEstimated,
          'Thực chi quyết toán': b.budgetActual,
          'Chứng từ': b.refDoc,
          'Trạng thái': b.status,
          'Ghi chú': b.note
        })));
        XLSX.utils.book_append_sheet(wb, wsBudget, 'Kinh_Phi_Quyet_Toan');

        // 4. Sheet Báo cáo sổ lưu
        const wsReports = XLSX.utils.json_to_sheet(state.savedReports.map(r => ({
          'Số báo cáo': r.code,
          'Tiêu đề báo cáo': r.title,
          'Ngày lập': r.reportDate,
          'Kỳ năm': r.year,
          'Người lập': r.author,
          'Chức vụ': r.position
        })));
        XLSX.utils.book_append_sheet(wb, wsReports, 'So_Luu_Tru_Bao_Cao');

        XLSX.writeFile(wb, `TDTT_Tan_Khai_${new Date().getFullYear()}.xlsx`);
        showToast('Xuất Excel thành công', 'File Excel tổng thể gồm 4 Sheet đã được tải xuống.');
      } catch (err) {
        showToast('Lỗi xuất Excel', err.message, 'error');
      }
    }

    /* ==============================================================================
       17. MÀN HÌNH ĐĂNG NHẬP & BẢO MẬT (MOBBIN CLEAN - KHÔNG LỘ MẬT KHẨU)
       ============================================================================== */
    function renderLogin() {
      return `
        <div class="min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden">
          <!-- Background Sports Atmosphere -->
          <div class="absolute inset-0 bg-gradient-to-br from-brand-950/90 via-slate-900 to-emerald-950 pointer-events-none"></div>
          <div class="absolute -top-40 -left-40 w-96 h-96 bg-brand-500/15 rounded-full blur-3xl pointer-events-none"></div>
          <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-emerald-500/15 rounded-full blur-3xl pointer-events-none"></div>

          <!-- Login Container Card -->
          <div class="w-full max-w-md relative z-10 glass-card rounded-3xl shadow-2xl border border-white/10 p-8 sm:p-10 text-center modal-animate">
            
            <!-- Pristine Official Circular Emblem -->
            <div class="relative w-28 h-28 sm:w-32 sm:h-32 mx-auto mb-5 rounded-full p-1 bg-white/95 dark:bg-slate-800/95 shadow-xl ring-4 ring-brand-700/10 dark:ring-white/10 flex items-center justify-center overflow-hidden transition-all duration-300 hover:scale-105 group">
              <img src="logo.png" onerror="if(typeof EMBEDDED_LOGO_B64!=='undefined') this.src=EMBEDDED_LOGO_B64" class="w-full h-full object-contain rounded-full" alt="Huy hiệu UBND Phường Tân Khai" />
            </div>

            <div class="mb-6">
              <h3 class="text-[11px] font-extrabold uppercase tracking-widest text-slate-500 dark:text-slate-400">ỦY BAN NHÂN DÂN PHƯỜNG TÂN KHAI</h3>
              <h2 class="text-xs font-extrabold uppercase tracking-wide text-brand-700 dark:text-brand-400 mt-1">TRUNG TÂM DỊCH VỤ TỔNG HỢP</h2>
              <h1 class="text-xl font-display font-extrabold tracking-tight text-slate-900 dark:text-white mt-1.5">
                Quản Lý Thể Dục Thể Thao
              </h1>
            </div>

            <!-- Clean Login Form (KHÔNG HIỂN THỊ TÊN ĐĂNG NHẬP HOẶC MẬT KHẨU MẶC ĐỊNH) -->
            <form onsubmit="handleLoginSubmit(event)" class="space-y-4 text-left">
              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Tài khoản cán bộ</label>
                <div class="relative">
                  <span class="material-symbols-outlined text-[18px] text-slate-400 absolute left-3 top-2.5">person</span>
                  <input id="login_user" type="text" required placeholder="Nhập tài khoản cán bộ..." class="w-full pl-9 pr-3 py-2.5 rounded-xl text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-brand-500 dark:text-white" />
                </div>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Mật khẩu</label>
                <div class="relative">
                  <span class="material-symbols-outlined text-[18px] text-slate-400 absolute left-3 top-2.5">lock</span>
                  <input id="login_pass" type="password" required placeholder="Nhập mật khẩu..." class="w-full pl-9 pr-9 py-2.5 rounded-xl text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-brand-500 dark:text-white" />
                  <button type="button" onclick="togglePassVisibility()" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
                    <span id="eyeIcon" class="material-symbols-outlined text-[18px]">visibility</span>
                  </button>
                </div>
              </div>

              <div class="flex items-center justify-between text-xs pt-1">
                <label class="flex items-center gap-1.5 text-slate-500 dark:text-slate-400 cursor-pointer">
                  <input type="checkbox" id="remember_me" class="w-4 h-4 rounded accent-brand-700 cursor-pointer" />
                  <span>Ghi nhớ đăng nhập</span>
                </label>
                <button type="button" onclick="toggleDarkMode()" class="text-slate-400 hover:text-slate-600 flex items-center gap-1">
                  <span class="material-symbols-outlined text-[16px]">${state.darkMode ? 'light_mode' : 'dark_mode'}</span>
                </button>
              </div>

              <div class="pt-2">
                <button type="submit" class="w-full py-3 px-4 bg-brand-700 hover:bg-brand-800 text-white font-bold text-xs rounded-xl shadow-glow-brand transition-all flex items-center justify-center gap-2 cursor-pointer btn-press">
                  <span>Đăng nhập hệ thống</span>
                  <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
                </button>
              </div>
            </form>

            <div class="pt-6 mt-6 border-t border-slate-100 dark:border-slate-800/80">
              <p class="text-[11px] text-slate-400 font-medium">Hệ thống thông tin nội bộ • Bảo mật chính quyền số</p>
            </div>
          </div>
        </div>
      `;
    }

    function togglePassVisibility() {
      const pass = document.getElementById('login_pass');
      const icon = document.getElementById('eyeIcon');
      if (pass && icon) {
        if (pass.type === 'password') {
          pass.type = 'text';
          icon.textContent = 'visibility_off';
        } else {
          pass.type = 'password';
          icon.textContent = 'visibility';
        }
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const u = document.getElementById('login_user').value.trim();
      const p = document.getElementById('login_pass').value;

      if ((u === 'admin' && p === 'D123@') || (u && p.length >= 4)) {
        state.isAuthenticated = true;
        lsSet('tk_auth', true);
        showToast('Đăng nhập thành công', 'Chào mừng Cán bộ Trung tâm Dịch vụ tổng hợp Phường Tân Khai.');
        renderApp();
      } else {
        showToast('Đăng nhập thất bại', 'Tài khoản hoặc mật khẩu không chính xác.', 'error');
      }
    }

    function handleLogout() {
      if (confirm('Bạn có muốn đăng xuất khỏi hệ thống?')) {
        state.isAuthenticated = false;
        lsSet('tk_auth', false);
        renderApp();
      }
    }

    function closeModal() {
      const m = document.getElementById('modalContainer');
      if (m) m.remove();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    /* ==============================================================================
       18. APP CONTAINER MOUNT & INIT
       ============================================================================== */
    function renderApp() {
      const app = document.getElementById('appContainer');
      if (!app) return;

      if (!state.isAuthenticated) {
        app.innerHTML = renderLogin();
        return;
      }

      let contentHTML = '';
      if (state.currentTab === 'bang-dieu-khien') contentHTML = renderDashboard();
      else if (state.currentTab === 'quan-ly-giai-dau') contentHTML = renderTournaments();
      else if (state.currentTab === 'quan-ly-clb') contentHTML = renderClubs();
      else if (state.currentTab === 'lich-sinh-hoat') contentHTML = renderSchedules();
      else if (state.currentTab === 'co-so-vat-chat') contentHTML = renderFacilities();
      else if (state.currentTab === 'kinh-phi') contentHTML = renderBudget();
      else if (state.currentTab === 'bao-cao') contentHTML = renderReports();

      app.innerHTML = `
        ${renderSidebar()}
        <div class="lg:pl-[270px] flex-1 flex flex-col min-h-screen">
          ${renderHeader()}
          <main class="flex-1 p-3.5 sm:p-6 pb-28 lg:pb-8 max-w-7xl w-full mx-auto">
            ${contentHTML}
          </main>
        </div>
        ${renderBottomNav()}
        ${renderMobileDrawer()}
      `;

      if (state.currentTab === 'bang-dieu-khien') {
        setTimeout(initDashboardCharts, 50);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      renderApp();
    });
  </script>
</body>
