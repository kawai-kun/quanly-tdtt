    /* ==============================================================================
       2. NORMALIZATION ENGINE (TỰ ĐỘNG CHUẨN HÓA KHUÔN MẪU DỮ LIỆU)
       ============================================================================== */
    function normalizeTitle(str) {
      if (!str) return '';
      let s = str.trim().replace(/\s+/g, ' ');
      s = s.charAt(0).toUpperCase() + s.slice(1);
      s = s.replace(/\btan khai\b/gi, 'Tân Khai')
           .replace(/\bdong nai\b/gi, 'Đồng Nai')
           .replace(/\btdtt\b/gi, 'TDTT')
           .replace(/\bubnd\b/gi, 'UBND')
           .replace(/\bvdv\b/gi, 'VĐV')
           .replace(/\bhcv\b/gi, 'HCV')
           .replace(/\bhcb\b/gi, 'HCB')
           .replace(/\bhcd\b/gi, 'HCĐ')
           .replace(/\bclb\b/gi, 'CLB');
      return s;
    }

    function normalizeCode(code, count) {
      if (!code) return 'T-' + String(count + 1).padStart(2, '0');
      let c = code.trim().toUpperCase().replace(/\s+/g, '');
      if (!c.startsWith('T-') && !c.startsWith('T')) {
        c = 'T-' + c;
      } else if (c.startsWith('T') && !c.startsWith('T-')) {
        c = 'T-' + c.slice(1);
      }
      return c;
    }

    function normalizeDate(d) {
      if (!d) {
        const today = new Date();
        return String(today.getDate()).padStart(2, '0') + '/' + String(today.getMonth() + 1).padStart(2, '0') + '/' + today.getFullYear();
      }
      let s = d.trim().replace(/[-.]/g, '/');
      const parts = s.split('/');
      if (parts.length === 3) {
        let day = parts[0].padStart(2, '0');
        let month = parts[1].padStart(2, '0');
        let year = parts[2];
        if (year.length === 2) year = '20' + year;
        return `${day}/${month}/${year}`;
      }
      return d;
    }

    function extractYearFromDate(dateStr) {
      if (!dateStr) return new Date().getFullYear();
      const match = dateStr.match(/\b(20\d\d)\b/);
      return match ? parseInt(match[1]) : new Date().getFullYear();
    }

    function extractQuarterFromDate(dateStr) {
      if (!dateStr) return 'q1';
      const parts = dateStr.split('/');
      if (parts.length >= 2) {
        const m = parseInt(parts[1]);
        if (m >= 1 && m <= 3) return 'q1';
        if (m >= 4 && m <= 6) return 'q2';
        if (m >= 7 && m <= 9) return 'q3';
        return 'q4';
      }
      return 'q1';
    }

    function autoDetectSport(title) {
      if (!title) return 'Bóng đá';
      const t = title.toLowerCase();
      if (t.includes('bóng đá')) return 'Bóng đá';
      if (t.includes('cầu lông')) return 'Cầu lông';

      if (t.includes('dưỡng sinh')) return 'Dưỡng sinh';

      if (t.includes('bơi')) return 'Bơi lội';
      if (t.includes('billiards')) return 'Billiards';
      return 'Thể thao phong trào';
    }

    function lsGet(k, def) {
      try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; }
    }
    function lsSet(k, v) {
      try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
    }

    function getAvailableYears() {
      const yearsSet = new Set();
      state.activities.forEach(a => {
        const y = a.year || extractYearFromDate(a.date);
        if (y) yearsSet.add(y);
      });
      state.budgetItems.forEach(b => {
        if (b.year) yearsSet.add(parseInt(b.year));
      });
      yearsSet.add(new Date().getFullYear());
      yearsSet.add(2026);
      yearsSet.add(2025);
      return Array.from(yearsSet).sort((a, b) => b - a);
    }

    /* ==============================================================================
       5. PERSISTENCE & AUTO-SYNC ENGINE
       ============================================================================== */
    let syncTimer = null;
    function queueAutoSync() {
      if (!state.autoSync || !state.apiUrl) return;
      if (syncTimer) clearTimeout(syncTimer);
      syncTimer = setTimeout(() => {
        pushToGoogleSheet(false);
      }, 2500);
    }

    function saveAll() {
      lsSet('tk_activities', state.activities);
      lsSet('tk_clubs', state.clubs);
      lsSet('tk_schedules', state.schedules);
      lsSet('tk_facilities', state.facilities);
      lsSet('tk_budget', state.budgetItems);
      lsSet('tk_saved_reports', state.savedReports);
      queueAutoSync();
    }

    /* ==============================================================================
       6. TOAST NOTIFICATIONS & THEME
       ============================================================================== */
    function showToast(title, msg, type = 'success') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const el = document.createElement('div');
      const isErr = type === 'error';
      const icon = isErr ? 'error' : (type === 'warning' ? 'warning' : 'check_circle');
      const borderCol = isErr ? 'border-rose-500' : 'border-brand-500';

      el.className = `pointer-events-auto flex items-start gap-3 p-4 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md rounded-2xl border-l-4 ${borderCol} shadow-mobbin-hover text-slate-800 dark:text-slate-100 max-w-sm transition-all duration-300 transform translate-y-2 opacity-0`;
      el.innerHTML = `
        <span class="material-symbols-outlined text-[20px] ${isErr ? 'text-rose-500' : 'text-brand-600'} shrink-0 mt-0.5">${icon}</span>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-bold leading-tight">${title}</p>
          <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 leading-snug">${msg}</p>
        </div>
      `;
      container.appendChild(el);
      requestAnimationFrame(() => {
        el.classList.remove('translate-y-2', 'opacity-0');
      });
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 3500);
    }

    function toggleDarkMode() {
      state.darkMode = !state.darkMode;
      lsSet('tk_dark', state.darkMode);
      initTheme();
      renderApp();
    }

      if (state.darkMode) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    function handleDashboardSearch(query) {
      if (!query.trim()) return;
      state.tournamentsFilter.search = query.trim();
      switchTab('quan-ly-giai-dau');
    }

    let donutChartInstance = null;
    let barChartInstance = null;

    function initDashboardCharts() {
      const filteredActs = state.selectedYear === 'all'
        ? state.activities
        : state.activities.filter(a => String(a.year || extractYearFromDate(a.date)) === String(state.selectedYear));

      // 1. Group by Sport
      const sportCounts = {};
      filteredActs.forEach(a => {
        const s = a.sport || 'Khác';
        sportCounts[s] = (sportCounts[s] || 0) + 1;
      });

      const donutEl = document.getElementById('sportsDonutChart');
      if (donutEl) {
        if (donutChartInstance) donutChartInstance.destroy();
        donutChartInstance = new Chart(donutEl, {
          type: 'doughnut',
          data: {
            labels: Object.keys(sportCounts),
            datasets: [{
              data: Object.values(sportCounts),
              backgroundColor: ['#059669', '#3b82f6', '#f59e0b', '#ec4899', '#8b5cf6', '#14b8a6', '#f97316'],
              borderWidth: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
            },
            cutout: '68%'
          }
        });
      }

      // 2. Group by Month
      const monthData = Array(12).fill(0);
      filteredActs.forEach(a => {
        const m = parseInt(a.month) || (a.date ? parseInt(a.date.split('/')[1]) : 1);
        if (m >= 1 && m <= 12) {
          monthData[m - 1] += parseInt(a.participants) || 0;
        }
      });

      const barEl = document.getElementById('timelineBarChart');
      if (barEl) {
        if (barChartInstance) barChartInstance.destroy();
        barChartInstance = new Chart(barEl, {
          type: 'bar',
          data: {
            labels: ['Th 1', 'Th 2', 'Th 3', 'Th 4', 'Th 5', 'Th 6', 'Th 7', 'Th 8', 'Th 9', 'Th 10', 'Th 11', 'Th 12'],
            datasets: [{
              label: 'Số lượng VĐV tham gia',
              data: monthData,
              backgroundColor: 'rgba(5, 150, 105, 0.75)',
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.04)' } },
              x: { grid: { display: false } }
            },
            plugins: {
              legend: { display: false }
            }
          }
        });
      }
    }

       9. TAB 2: QUẢN LÝ GIẢI ĐẤU (TOURNAMENTS) - FULL CRUD

    function renderTournaments() {
      const f = state.tournamentsFilter;

      let acts = state.activities.filter(a => {

        if (state.selectedYear !== 'all' && y !== String(state.selectedYear)) return false;
        if (f.category !== 'all' && a.category !== f.category) return false;
        if (f.sport !== 'all' && a.sport !== f.sport) return false;
        if (f.search) {
          const q = f.search.toLowerCase();
          const matchTitle = (a.title || '').toLowerCase().includes(q);
          const matchCode = (a.code || '').toLowerCase().includes(q);
          const matchSport = (a.sport || '').toLowerCase().includes(q);
          const matchLoc = (a.location || '').toLowerCase().includes(q);
          if (!matchTitle && !matchCode && !matchSport && !matchLoc) return false;
        }
        return true;
      });

      // Danh sách bộ môn độc nhất
      const sportList = Array.from(new Set(state.activities.map(a => a.sport || 'Bóng đá')));

              <!-- Year Filter -->

              </button>

          </div>

          <!-- Cards View or Table View -->
          ${f.viewMode === 'cards' ? renderTournamentsGrid(acts) : renderTournamentsTable(acts)}

        </div>
      `;
    }

    function handleSaveClub(e) {
      e.preventDefault();
      const id = document.getElementById('club_id').value;
      const item = {
        id: id || 'club-' + Date.now(),
        code: document.getElementById('club_code').value.trim() || 'CLB-0' + (state.clubs.length + 1),
        name: normalizeTitle(document.getElementById('club_name').value),
        sport: normalizeTitle(document.getElementById('club_sport').value),
        leader: normalizeTitle(document.getElementById('club_leader').value),
        phone: document.getElementById('club_phone').value.trim(),
        membersCount: parseInt(document.getElementById('club_members').value) || 0,
        establishedYear: parseInt(document.getElementById('club_year').value) || 2024,
        location: normalizeTitle(document.getElementById('club_loc').value),
        status: document.getElementById('club_status').value
      };

      if (id) {
        const idx = state.clubs.findIndex(c => c.id === id);
        if (idx !== -1) state.clubs[idx] = item;
      } else {
        state.clubs.unshift(item);
      }
      saveAll();
      closeModal();
      showToast('Đã lưu CLB', `Câu lạc bộ "${item.name}" đã được cập nhật.`);
      renderApp();
    }

    function confirmDeleteClub(id) {
      const c = state.clubs.find(item => item.id === id);
      if (confirm(`Bạn có chắc chắn muốn xóa "${c ? c.name : 'CLB này'}"?`)) {

        renderApp();

    function handleSaveFacility(e) {
      e.preventDefault();
      const id = document.getElementById('fac_id').value;
      const item = {
        id: id || 'fac-' + Date.now(),
        name: normalizeTitle(document.getElementById('fac_name').value),
        type: document.getElementById('fac_type').value,
        location: normalizeTitle(document.getElementById('fac_loc').value),
        capacity: parseInt(document.getElementById('fac_capacity').value) || 0,
        usageRate: parseInt(document.getElementById('fac_usage').value) || 0,
        manager: normalizeTitle(document.getElementById('fac_manager').value),
        status: document.getElementById('fac_status').value,
        note: document.getElementById('fac_note').value.trim()
      };

      if (id) {
        const idx = state.facilities.findIndex(f => f.id === id);
        if (idx !== -1) state.facilities[idx] = item;
      } else {
        state.facilities.unshift(item);
      }
      saveAll();
      closeModal();
      showToast('Đã lưu cơ sở', `Cơ sở "${item.name}" đã được cập nhật.`);
      renderApp();
    }

        saveAll();
        showToast('Đã xóa', 'Cơ sở vật chất đã được xóa khỏi danh sách.');
        renderApp();
      }

                <p class="text-[10px] text-slate-500">${position}</p>

    function viewReport(repId) {
      state.activeReportId = repId;
      state.reportSubTab = 'document';

    }

    function createNewReportPrompt() {
      const maxRepNum = state.savedReports.reduce((m, r) => Math.max(m, parseInt(r.reportNumber) || 0), 0);
      const nextNum = maxRepNum + 1;
      const numStr = String(nextNum).padStart(2, '0');
      const newRep = {
        id: 'rep-' + Date.now(),
        reportNumber: nextNum,
        code: `${numStr}/BC-TTDVTH`,
        title: `Báo cáo phát triển TDTT Phường Tân Khai năm ${new Date().getFullYear()}`,
        reportDate: new Date().toLocaleDateString('vi-VN'),
        year: String(state.selectedYear === 'all' ? new Date().getFullYear() : state.selectedYear),
        quarter: 'all',
        author: 'Trần Quốc Đức',
        position: 'Cán bộ Trung tâm Dịch vụ tổng hợp',
        createdAt: new Date().toISOString()
      };
      state.savedReports.unshift(newRep);
      state.activeReportId = newRep.id;
      saveAll();
      showToast('Đã tạo báo cáo mới', `Đã thêm báo cáo số ${newRep.code} vào Sổ.`);
      renderApp();
    }

    function saveCurrentReportAsNew() {
      createNewReportPrompt();
    }

    function editReportModal(repId) {
      const rep = state.savedReports.find(r => r.id === repId);
      if (!rep) return;

      const modal = document.createElement('div');
      modal.id = 'modalContainer';
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm';
      modal.innerHTML = `
        <div class="relative w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 modal-animate text-left">

            <button onclick="closeModal()" class="p-1 rounded-lg text-slate-400"><span class="material-symbols-outlined">close</span></button>
          </div>

              <input id="edit_rep_num" type="number" required value="${rep.reportNumber}" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-mono" />

            </div>
            <div>
              <label class="block font-bold mb-1">Tiêu đề báo cáo</label>
              <textarea id="edit_rep_title" rows="3" required class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">${rep.title}</textarea>
            </div>
            <div class="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">

              <button type="submit" class="px-5 py-2 rounded-xl font-bold text-white bg-brand-700 hover:bg-brand-800 shadow-sm btn-press">Cập nhật</button>
            </div>
          </form>
        </div>
      `;

        document.getElementById('edit_rep_code').value = `${val}/BC-TTDVTH`;
      });

    function handleSaveEditReport(e, repId) {
      e.preventDefault();
      const rep = state.savedReports.find(r => r.id === repId);
      if (rep) {
        rep.reportNumber = parseInt(document.getElementById('edit_rep_num').value) || rep.reportNumber;
        rep.code = document.getElementById('edit_rep_code').value.trim();
        rep.title = document.getElementById('edit_rep_title').value.trim();
        saveAll();
        closeModal();
        showToast('Đã cập nhật báo cáo', `Báo cáo số ${rep.code} đã được chỉnh sửa.`);
        renderApp();
      }
    }

    function deleteReport(repId) {
      const rep = state.savedReports.find(r => r.id === repId);
      if (confirm(`Bạn có chắc chắn muốn xóa báo cáo "${rep ? rep.code : ''}" khỏi Sổ lưu trữ?`)) {
        state.savedReports = state.savedReports.filter(r => r.id !== repId);
        if (state.activeReportId === repId && state.savedReports.length) {
          state.activeReportId = state.savedReports[0].id;
        }
        saveAll();
        showToast('Đã xóa báo cáo', 'Báo cáo đã được xóa khỏi sổ.');
        renderApp();
      }
    }

    function handleSaveActivity(e) {
      e.preventDefault();
      const id = document.getElementById('act_id').value;
      const g = parseInt(document.getElementById('act_gold').value) || 0;
      const s = parseInt(document.getElementById('act_silver').value) || 0;
      const b = parseInt(document.getElementById('act_bronze').value) || 0;
      const bWard = parseInt(document.getElementById('act_budgetWard').value) || 0;
      const bPrize = parseInt(document.getElementById('act_budgetPrize').value) || 0;

      const rawTitle = document.getElementById('act_title').value;
      const cleanTitle = normalizeTitle(rawTitle);

      const rawCode = document.getElementById('act_code').value;
      const cleanCode = normalizeCode(rawCode, state.activities.length);

      const rawDate = document.getElementById('act_date').value;
      const cleanDate = normalizeDate(rawDate);
      const year = extractYearFromDate(cleanDate);
      const quarter = extractQuarterFromDate(cleanDate);

      const rawSport = document.getElementById('act_sport').value;
      const sport = rawSport.trim() ? normalizeTitle(rawSport) : autoDetectSport(cleanTitle);

      const rawNote = document.getElementById('act_note') ? document.getElementById('act_note').value.trim() : '';

      const item = {
        id: id || 'act-' + Date.now(),
        code: cleanCode,
        title: cleanTitle,
        sport: sport,
        category: document.getElementById('act_category').value,
        date: cleanDate,
        year: year,
        quarter: quarter,
        month: parseInt(cleanDate.split('/')[1]) || 1,
        participants: parseInt(document.getElementById('act_participants').value) || 0,
        participantsUnit: 'VĐV',
        location: normalizeTitle(document.getElementById('act_location').value),
        achievementNote: rawNote,
        status: 'Đã hoàn thành',
        goldMedals: g,
        silverMedals: s,
        bronzeMedals: b,
        totalMedals: g + s + b,
        budgetWard: bWard,
        budgetPrize: bPrize,
        budgetTotal: bWard + bPrize,
        budgetStatus: 'Đã quyết toán'
      };

      if (id) {
        const idx = state.activities.findIndex(a => a.id === id);
        if (idx !== -1) state.activities[idx] = item;
      } else {
        state.activities.unshift(item);
      }
      saveAll();
      closeModal();
      showToast('Đã lưu thành công', `Giải đấu "${item.title}" đã được chuẩn hóa và lưu trữ.`);
      renderApp();
    }

    function confirmDeleteActivity(id) {
      if (confirm('Bạn có chắc muốn xóa giải đấu này?')) {
        state.activities = state.activities.filter(a => a.id !== id);
        saveAll();
        showToast('Đã xóa', 'Giải đấu đã được xóa khỏi hệ thống.');
        renderApp();
      }
    }

    function saveApiUrl() {
      const v = document.getElementById('sync_api_url').value.trim();
      state.apiUrl = v;
      lsSet('tk_api_url', v);
      showToast('Đã lưu URL', 'Hệ thống sẽ đồng bộ với Apps Script Web App này.');
      renderSyncPill();
    }
    function toggleAutoSync(v) {
      state.autoSync = v;
      lsSet('tk_auto_sync', v);
    }

    async function pushToGoogleSheet(isManual = false) {
      if (!state.apiUrl) {
        if (isManual) openSyncModal();
        return;
      }

      state.syncStatus = 'syncing';
      renderSyncPill();

      const payload = {
        action: 'save_all',
        activities: state.activities,
        clubs: state.clubs,
        schedules: state.schedules,
        facilities: state.facilities,
        budget: state.budgetItems,
        reports: state.savedReports,
        timestamp: new Date().toISOString()
      };

      try {
        const resp = await fetch(state.apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const res = await resp.json();
        if (res.status === 'success' || res.success) {
          state.syncStatus = 'success';
          state.lastSyncTime = new Date().toLocaleTimeString('vi-VN');
          lsSet('tk_last_sync', state.lastSyncTime);
          if (isManual) showToast('Đồng bộ thành công', 'Toàn bộ dữ liệu đã được lưu an toàn lên Google Drive.');
        } else {
          state.syncStatus = 'error';
          if (isManual) showToast('Lỗi lưu Sheet', res.message || res.error || 'Không thể ghi vào Google Sheet', 'error');
        }
      } catch (err) {
        state.syncStatus = 'error';
        if (isManual) showToast('Lỗi kết nối', 'Không thể kết nối với Web App Google Drive.', 'error');
      } finally {
        renderSyncPill();
      }
    }

    async function pullFromGoogleSheet() {
      if (!state.apiUrl) {
        openSyncModal();
        return;
      }

      state.syncStatus = 'syncing';
      renderSyncPill();

      try {
        const url = state.apiUrl + (state.apiUrl.includes('?') ? '&' : '?') + 'action=load_all';
        const resp = await fetch(url);
        const res = await resp.json();
        if ((res.status === 'success' || res.success) && res.data) {
          if (res.data.activities) state.activities = res.data.activities;
          if (res.data.clubs) state.clubs = res.data.clubs;
          if (res.data.schedules) state.schedules = res.data.schedules;
          if (res.data.facilities) state.facilities = res.data.facilities;
          if (res.data.budget) state.budgetItems = res.data.budget;
          if (res.data.reports) state.savedReports = res.data.reports;

          state.syncStatus = 'success';
          state.lastSyncTime = new Date().toLocaleTimeString('vi-VN');
          lsSet('tk_last_sync', state.lastSyncTime);
          saveAll();
          showToast('Nạp dữ liệu thành công', 'Đã đồng bộ cơ sở dữ liệu mới nhất từ Google Sheet.');
          closeModal();
          renderApp();
        } else {
          state.syncStatus = 'error';
          showToast('Lỗi nạp', res.message || res.error || 'Không có dữ liệu trên Sheet', 'error');
        }
      } catch (err) {
        state.syncStatus = 'error';
        showToast('Lỗi kết nối', 'Không thể tải dữ liệu từ Google Drive.', 'error');
      } finally {
        renderSyncPill();
      }
    }

          'Tổng HC': a.totalMedals,
          'Kinh phí Phường': a.budgetWard,
          'Kinh phí Thưởng': a.budgetPrize,
          'Tổng kinh phí': a.budgetTotal,
          'Tình trạng': a.status
        })));
        XLSX.utils.book_append_sheet(wb, wsActs, 'Giai_Thi_Dau');

        // 2. Sheet CLB

          'Mã CLB': c.code,
          'Tên câu lạc bộ': c.name,
          'Môn thể thao': c.sport,
          'Chủ nhiệm': c.leader,
          'Số điện thoại': c.phone,
          'Số hội viên': c.membersCount,
          'Địa bàn': c.location,
          'Năm thành lập': c.establishedYear,
          'Trạng thái': c.status
        })));
        XLSX.utils.book_append_sheet(wb, wsClubs, 'Cau_Lac_Bo');

        // 3. Sheet Kinh phí
        const wsBudget = XLSX.utils.json_to_sheet(state.budgetItems.map(b => ({
          'Mã chi': b.code,
          'Hạng mục chi': b.title,
          'Năm': b.year,

          'Trạng thái': b.status,
          'Ghi chú': b.note
        })));
        XLSX.utils.book_append_sheet(wb, wsBudget, 'Kinh_Phi_Quyet_Toan');

        // 4. Sheet Báo cáo sổ lưu
        const wsReports = XLSX.utils.json_to_sheet(state.savedReports.map(r => ({
          'Số báo cáo': r.code,

          'Chức vụ': r.position
        })));
        XLSX.utils.book_append_sheet(wb, wsReports, 'So_Luu_Tru_Bao_Cao');

        XLSX.writeFile(wb, `TDTT_Tan_Khai_${new Date().getFullYear()}.xlsx`);
        showToast('Xuất Excel thành công', 'File Excel tổng thể gồm 4 Sheet đã được tải xuống.');
      } catch (err) {
        showToast('Lỗi xuất Excel', err.message, 'error');
      }

          <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-emerald-500/15 rounded-full blur-3xl pointer-events-none"></div>

          <!-- Login Container Card -->
          <div class="w-full max-w-md relative z-10 glass-card rounded-3xl shadow-2xl border border-white/10 p-8 sm:p-10 text-center modal-animate">
            
            <!-- Pristine Official Circular Emblem -->
            <div class="relative w-28 h-28 sm:w-32 sm:h-32 mx-auto mb-5 rounded-full p-1 bg-white/95 dark:bg-slate-800/95 shadow-xl ring-4 ring-brand-700/10 dark:ring-white/10 flex items-center justify-center overflow-hidden transition-all duration-300 hover:scale-105 group">
              <img src="logo.png" onerror="if(typeof EMBEDDED_LOGO_B64!=='undefined') this.src=EMBEDDED_LOGO_B64" class="w-full h-full object-contain rounded-full" alt="Huy hiệu UBND Phường Tân Khai" />
            </div>

            <div class="mb-6">
              <h3 class="text-[11px] font-extrabold uppercase tracking-widest text-slate-500 dark:text-slate-400">ỦY BAN NHÂN DÂN PHƯỜNG TÂN KHAI</h3>
              <h2 class="text-xs font-extrabold uppercase tracking-wide text-brand-700 dark:text-brand-400 mt-1">TRUNG TÂM DỊCH VỤ TỔNG HỢP</h2>
              <h1 class="text-xl font-display font-extrabold tracking-tight text-slate-900 dark:text-white mt-1.5">
                Quản Lý Thể Dục Thể Thao
              </h1>
            </div>

            <!-- Clean Login Form (KHÔNG HIỂN THỊ TÊN ĐĂNG NHẬP HOẶC MẬT KHẨU MẶC ĐỊNH) -->
            <form onsubmit="handleLoginSubmit(event)" class="space-y-4 text-left">
              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Tài khoản cán bộ</label>
                <div class="relative">
                  <span class="material-symbols-outlined text-[18px] text-slate-400 absolute left-3 top-2.5">person</span>
                  <input id="login_user" type="text" required placeholder="Nhập tài khoản cán bộ..." class="w-full pl-9 pr-3 py-2.5 rounded-xl text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-brand-500 dark:text-white" />
                </div>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Mật khẩu</label>
                <div class="relative">
                  <span class="material-symbols-outlined text-[18px] text-slate-400 absolute left-3 top-2.5">lock</span>
                  <input id="login_pass" type="password" required placeholder="Nhập mật khẩu..." class="w-full pl-9 pr-9 py-2.5 rounded-xl text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-brand-500 dark:text-white" />
                  <button type="button" onclick="togglePassVisibility()" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
                    <span id="eyeIcon" class="material-symbols-outlined text-[18px]">visibility</span>
                  </button>
                </div>
              </div>

              <div class="flex items-center justify-between text-xs pt-1">
                <label class="flex items-center gap-1.5 text-slate-500 dark:text-slate-400 cursor-pointer">
                  <input type="checkbox" id="remember_me" class="w-4 h-4 rounded accent-brand-700 cursor-pointer" />
                  <span>Ghi nhớ đăng nhập</span>
                </label>
                <button type="button" onclick="toggleDarkMode()" class="text-slate-400 hover:text-slate-600 flex items-center gap-1">
                  <span class="material-symbols-outlined text-[16px]">${state.darkMode ? 'light_mode' : 'dark_mode'}</span>
                </button>
              </div>

              <div class="pt-2">
                <button type="submit" class="w-full py-3 px-4 bg-brand-700 hover:bg-brand-800 text-white font-bold text-xs rounded-xl shadow-glow-brand transition-all flex items-center justify-center gap-2 cursor-pointer btn-press">
                  <span>Đăng nhập hệ thống</span>
                  <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
                </button>
              </div>
            </form>

            <div class="pt-6 mt-6 border-t border-slate-100 dark:border-slate-800/80">
              <p class="text-[11px] text-slate-400 font-medium">Hệ thống thông tin nội bộ • Bảo mật chính quyền số</p>
            </div>
          </div>
        </div>
      `;
    }

    function togglePassVisibility() {
      const pass = document.getElementById('login_pass');
      const icon = document.getElementById('eyeIcon');
      if (pass && icon) {
        if (pass.type === 'password') {
          pass.type = 'text';
          icon.textContent = 'visibility_off';
        } else {
          pass.type = 'password';
          icon.textContent = 'visibility';
        }
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const u = document.getElementById('login_user').value.trim();
      const p = document.getElementById('login_pass').value;

      if ((u === 'admin' && p === 'D123@') || (u && p.length >= 4)) {
        state.isAuthenticated = true;
        lsSet('tk_auth', true);
        showToast('Đăng nhập thành công', 'Chào mừng Cán bộ Trung tâm Dịch vụ tổng hợp Phường Tân Khai.');
        renderApp();
      } else {
        showToast('Đăng nhập thất bại', 'Tài khoản hoặc mật khẩu không chính xác.', 'error');
      }
    }

    function handleLogout() {
      if (confirm('Bạn có muốn đăng xuất khỏi hệ thống?')) {
        state.isAuthenticated = false;
        lsSet('tk_auth', false);
        renderApp();
      }
    }

    function closeModal() {
      const m = document.getElementById('modalContainer');
      if (m) m.remove();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    /* ==============================================================================
       18. APP CONTAINER MOUNT & INIT
       ============================================================================== */
    function renderApp() {
      const app = document.getElementById('appContainer');
      if (!app) return;

      if (!state.isAuthenticated) {
        app.innerHTML = renderLogin();
        return;
      }

      let contentHTML = '';
      if (state.currentTab === 'bang-dieu-khien') contentHTML = renderDashboard();
      else if (state.currentTab === 'quan-ly-giai-dau') contentHTML = renderTournaments();
      else if (state.currentTab === 'quan-ly-clb') contentHTML = renderClubs();
      else if (state.currentTab === 'lich-sinh-hoat') contentHTML = renderSchedules();
      else if (state.currentTab === 'co-so-vat-chat') contentHTML = renderFacilities();
      else if (state.currentTab === 'kinh-phi') contentHTML = renderBudget();
      else if (state.currentTab === 'bao-cao') contentHTML = renderReports();

      app.innerHTML = `
        ${renderSidebar()}
        <div class="lg:pl-[270px] flex-1 flex flex-col min-h-screen">
          ${renderHeader()}
          <main class="flex-1 p-3.5 sm:p-6 pb-28 lg:pb-8 max-w-7xl w-full mx-auto">
            ${contentHTML}
          </main>
        </div>
        ${renderBottomNav()}
        ${renderMobileDrawer()}
      `;

      if (state.currentTab === 'bang-dieu-khien') {
        setTimeout(initDashboardCharts, 50);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      renderApp();
    });
  </script>
</body>
</html>
